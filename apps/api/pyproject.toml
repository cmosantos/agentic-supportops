[project]
name = "agentic-supportops-api"
version = "0.1.0"
description = "Backend API for Agentic SupportOps"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "openai>=2.0,<3.0",
  "pydantic>=2.11,<3.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
