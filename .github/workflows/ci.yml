name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install backend dependencies
        run: uv sync --frozen --extra dev

      - name: Check dependency health
        run: uv pip check

      - name: Import application
        run: uv run --frozen python -c "from main import app; assert app"

      - name: Run backend test suite
        run: uv run --frozen python -m pytest

      - name: Run real MCP stdio parity tests
        run: uv run --frozen python -m pytest tests/test_mcp_integration.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend behavioral tests
        run: npm run test:run

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build
